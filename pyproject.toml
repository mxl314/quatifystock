[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-framework"
version = "0.1.0"
description = "Modular event-driven Python quantitative trading framework"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
quant-framework = "quant_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

