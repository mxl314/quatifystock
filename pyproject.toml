[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esunny-quant"
version = "0.1.0"
description = "Event-driven Python trading framework for Esunny Dstar V10"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
esunny-quant = "esunny_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

